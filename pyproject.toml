[project]
name = "mtf2json"
version = "0.2.8"
description = "Convert the MegaMek MTF format to JSON."
authors = [
  { name = "juk0de", email = "juk0de@kadidlo.de" },
]
license = "GPL-3.0-or-later"
readme = "README.md"
homepage = "https://github.com/juk0de/mtf2json"
repository = "https://github.com/juk0de/mtf2json"
keywords = ['MTF', 'JSON', 'MegaMek', 'BattleTech']
classifiers = [
  "Programming Language :: Python :: 3",
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)"
]
requires-python = ">=3.12"
dependencies = [ 
    "pandas>=2.3.0"
]

[project.scripts]
mtf2json = 'mtf2json.cli:main'

[tool.poetry.group.dev.dependencies]
mypy = "^1.16.1"
ruff = "^0.6.9"
pandas-stubs = "^2.2.3.250527"
python-lsp-server = "^1.12.2"
pylsp-rope = "^0.1.17"

[tool.poetry.group.test.dependencies]
pytest = "^8.4.1"
pytest-cov = "^5.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

#[tool.basedpyright]
# see https://github.com/DetachHead/basedpyright/blob/main/docs/configuration/config-files.md#sample-pyprojecttoml-file
# -> deactivated in favor of 'pylsp' ('python-lsp-server')
#include = ["mtf2json", "test"]
#typeCheckingMode = "off"
